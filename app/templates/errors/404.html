{% extends 'base.html' %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/_error.css') }}">
{% endblock %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist, or the link may be out of date.</p>
        <a href="{{ back_url }}" class="btn-pill btn-pill--primary">
            <i class="bx bx-left-arrow-alt"></i> Back to Previous Page
        </a>
    </div>
</section>
{% endblock %}
