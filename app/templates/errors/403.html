{% extends 'base.html' %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/_error.css') }}">
{% endblock %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-card">
        <span class="error-code">403</span>
        <h1>Access Denied</h1>
        <p>You don't have permission to open this page.</p>
        <a href="{{ back_url }}" class="btn-pill btn-pill--primary">
            <i class="bx bx-left-arrow-alt"></i> Back to Previous Page
        </a>
    </div>
</section>
{% endblock %}
