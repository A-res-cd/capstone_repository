{% extends 'base.html' %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/_error.css') }}">
{% endblock %}

{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-card">
        <span class="error-code">500</span>
        <h1>Something Went Wrong</h1>
        <p>An unexpected error occurred on our end. It's been logged — try again in a moment.</p>
        <a href="{{ url_for('main.home') }}" class="btn-pill btn-pill--primary">
            <i class="bx bx-home-alt"></i> Back to Home
        </a>
    </div>
</section>
{% endblock %}
