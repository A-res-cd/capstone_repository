<ul class="password-policy" aria-label="Password requirements">
    <li data-password-rule="length">8–12 characters</li>
    <li data-password-rule="uppercase">At least one uppercase letter</li>
    <li data-password-rule="lowercase">At least one lowercase letter</li>
    <li data-password-rule="number">At least one number</li>
</ul>
<p class="password-feedback" data-password-status role="status" aria-live="polite">Enter a password to check requirements.</p>
