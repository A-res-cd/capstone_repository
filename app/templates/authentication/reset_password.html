<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fp.css') }}">
</head>
<body>

<div class="card">

  <h1 class="card-title">Reset Password</h1>
  <p class="card-subtitle">Choose a new password for your account</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-list">
        {% for category, message in messages %}
          <li class="flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('main.reset_password_route') }}" novalidate>

    <div class="form-group">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password"
             placeholder="Min. 6 characters"
             autocomplete="new-password"
             minlength="6" required>
      <p class="field-hint">At least 6 characters</p>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             placeholder="Type again"
             autocomplete="new-password"
             minlength="6" required>
    </div>

    <button type="submit" class="btn-primary">Reset Password</button>

  </form>

  <div class="footer-links">
    <p><a href="{{ url_for('main.signin') }}">Back to sign in</a></p>
  </div>

</div>

<script>
  // Client-side match check before submit
  const form    = document.querySelector('form');
  const pass    = document.getElementById('new_password');
  const confirm = document.getElementById('confirm_password');

  form.addEventListener('submit', (e) => {
    if (pass.value !== confirm.value) {
      e.preventDefault();
      confirm.style.borderColor = '#A32D2D';
      confirm.style.boxShadow   = '0 0 0 3px rgba(163,45,45,0.15)';
      confirm.setCustomValidity('Passwords do not match.');
      confirm.reportValidity();
    } else {
      confirm.setCustomValidity('');
    }
  });

  confirm.addEventListener('input', () => {
    confirm.style.borderColor = '';
    confirm.style.boxShadow   = '';
    confirm.setCustomValidity('');
  });
</script>

</body>
</html>
