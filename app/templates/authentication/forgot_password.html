<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fp.css') }}">
</head>
<body>

<div class="card">

  <h1 class="card-title">Forgot Password</h1>
  <p class="card-subtitle">Enter your username and email to receive an OTP</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-list">
        {% for category, message in messages %}
          <li class="flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('main.forgot_password') }}" novalidate>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             placeholder="Type here"
             autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email"
             placeholder="Type here"
             autocomplete="email" required>
    </div>

    <button type="submit" class="btn-primary">Send OTP</button>

  </form>

  <div class="footer-links">
    <p>Remembered it? <a href="{{ url_for('main.signin') }}">Sign in</a></p>
  </div>

</div>

</body>
</html>
