<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('capre-theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* localStorage unavailable — default to light */ }
        })();
    </script>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/index.css') }}">

    {% block extra_css %}{% endblock %}

    <title>{% block title %}My App{% endblock %}</title>
</head>
<body>
    {% if not hide_header %}
        {% include 'partials/header.html' %}
    {% endif %}

    <div class="layout{% if nav_collapsed %} collapsed{% endif %}">

        {% if not hide_nav %}
            {% include 'partials/navbar.html' %}
        {% endif %}

        <div class="main-wrapper">
            <main id="page-content">
                {% block content %}{% endblock %}
            </main>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    <script src="{{ url_for('static', filename='js/spa_navigation.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
